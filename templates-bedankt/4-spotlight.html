<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--g:#25d366;--p:#a0628f;--bg:#050607}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:#fff;font-family:"Plus Jakarta Sans",sans-serif;overflow-x:hidden}
.nav{display:flex;justify-content:space-between;align-items:center;padding:22px 5vw;position:relative;z-index:5}
.nav img{height:34px}.nav a.cta{background:var(--g);color:#04140a;padding:12px 20px;border-radius:99px;font-weight:800;text-decoration:none}
.btn{display:inline-flex;align-items:center;gap:14px;padding:18px 18px 18px 30px;border-radius:99px;background:#fff;color:#04140a;font-weight:800;font-size:18px;text-decoration:none;transition:.3s cubic-bezier(.16,1,.3,1)}
.btn i{width:40px;height:40px;border-radius:50%;background:var(--g);display:grid;place-items:center;font-style:normal;transition:.3s}
.btn:hover{background:var(--g);transform:translateY(-3px);box-shadow:0 20px 60px #25d36666}.btn:hover i{background:#04140a;color:var(--g);transform:rotate(45deg)}
.team{display:flex;align-items:center;gap:16px}.team span{display:flex}.team img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--bg);margin-left:-14px}.team img:first-child{margin-left:0}
.team small{display:block;color:var(--g);letter-spacing:.2em;font-weight:800;font-size:11px}.team b{font-size:18px}
.video{aspect-ratio:16/9;border-radius:22px;overflow:hidden;border:1px solid #ffffff22;background:#000;box-shadow:0 40px 120px #000,0 0 80px #25d36622}
.video video{width:100%;height:100%;object-fit:cover;display:block}
.odoo{display:inline-block;height:1em;width:auto;vertical-align:-.12em}
@keyframes up{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
.rise{animation:up 1s cubic-bezier(.16,1,.3,1) both}
</style>
<title>Bedankt 4 Spotlight</title><style>
body{background:radial-gradient(600px circle at var(--x,50%) var(--y,40%),#25d36622,transparent 60%),var(--bg)}
.dots{position:fixed;inset:0;background-image:radial-gradient(#ffffff1a 1px,transparent 1px);background-size:28px 28px;mask:radial-gradient(500px circle at var(--x,50%) var(--y,40%),#000,transparent);pointer-events:none}
.wrap{position:relative;display:grid;grid-template-columns:1.1fr 1fr;gap:4vw;padding:6vh 5vw;align-items:center}
h1{font-size:7vw;font-weight:800;line-height:.88;letter-spacing:-.05em}
.swap{display:block;height:.95em;overflow:hidden;color:var(--g)}
.swap span{display:block;animation:sw 10s cubic-bezier(.7,0,.2,1) infinite}
@keyframes sw{0%,18%{transform:translateY(0)}20%,38%{transform:translateY(-20%)}40%,58%{transform:translateY(-40%)}60%,78%{transform:translateY(-60%)}80%,100%{transform:translateY(-80%)}}
.swap i{display:block;font-style:normal;height:.95em;white-space:nowrap}
h1 .odoo{height:1em;margin-top:.12em;display:block}
.o1{transform-origin:224px 271px;animation:puls 2s ease-in-out infinite}@keyframes puls{50%{transform:scale(1.15)}}
p{font-size:21px;color:#fffb;margin:28px 0 34px;max-width:28em}
.vid{transform:perspective(1200px) rotateY(-12deg) rotateX(4deg);transition:.6s}.vid:hover{transform:none}
.foot{position:relative;padding:20px 5vw 50px}
@media(max-width:900px){.wrap{grid-template-columns:1fr}h1{font-size:16vw}.vid{transform:none}}
