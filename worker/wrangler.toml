name = "milo-chat"
main = "milo-worker.js"
compatibility_date = "2024-11-01"

# Na deploy krijg je een URL zoals: https://milo-chat.<jouw-subdomein>.workers.dev
# Die URL is niet geheim en staat in proposal/ui.tsx. De Gemini-sleutel staat
# uitsluitend hier, als secret:
#
#   npx wrangler secret put GEMINI_API_KEY
#
# Optioneel een ander model afdwingen:
#   npx wrangler secret put GEMINI_MODEL
