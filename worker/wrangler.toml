name = "milo-chat"
main = "milo-worker.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# 30 september 2026: Milo antwoordt met Claude Opus 5.5. Sleutels alleen als secret, nooit in deze repo:
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put GEMINI_API_KEY   (optioneel vangnet)
# De kennis (kennis.txt) wordt als tekstmodule meegebundeld.

# Hoogstens 12 vragen per minuut per bezoeker (IP). Houdt misbruik en kosten in de hand.
[[ratelimits]]
name = "MILO_LIMIET"
namespace_id = "3001"

  [ratelimits.simple]
  limit = 12
  period = 60
