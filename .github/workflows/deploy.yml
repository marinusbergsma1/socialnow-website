name: Bouwproef

# socialnow.nl draait op Vercel. GitHub Pages was een tweede, overbodige kopie en houdt
# de repo publiek (1 oktober 2026). Deze job controleert nu alleen dat de site bouwt.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
