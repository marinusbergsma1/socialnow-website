<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Book a call | SocialNow</title>
  <meta name="description" content="Plan a call with SocialNow. Pick a moment, get a Google Meet invite.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="preload" href="/fonts/inter-latin-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/inter-latin-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/stijl.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="kop">
    <a class="logo" href="https://socialnow.nl" aria-label="SocialNow">
      <img src="/img/SocialNow-Logo-2026-400.webp" srcset="/img/SocialNow-Logo-2026-400.webp 400w, /img/SocialNow-Logo-2026-600.webp 600w" sizes="150px" width="150" height="23" alt="SocialNow">
    </a>
    <div class="taal" role="group" aria-label="Language">
      <button type="button" data-taal="en">EN</button>
      <button type="button" data-taal="nl">NL</button>
    </div>
  </header>

  <main class="kaart">
    <aside class="info">
      <p class="label" id="label">SocialNow</p>
      <h1 id="titel">Book a call</h1>
      <p class="intro" id="intro">Pick a moment that suits you. You get a Google Meet invite straight away.</p>
      <ul class="feiten" id="feiten" hidden>
        <li><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span id="feit-duur"></span></li>
        <li><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="3"/><path d="M16 10l5-3v10l-5-3"/></svg><span>Google Meet</span></li>
        <li><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg><span id="feit-zone"></span></li>
      </ul>
      <p class="demo" id="demo" hidden></p>
    </aside>

    <section class="paneel" id="paneel" aria-live="polite">
      <div class="laden" aria-hidden="true"><span></span><span></span><span></span></div>
    </section>
  </main>

  <footer class="voet">
    <p id="voet">No tracking. We only use your details for this call.</p>
    <a id="privacy" href="https://socialnow.nl/privacy">Privacy</a>
  </footer>
  <noscript><p class="geenjs">This booking page needs JavaScript. Mail <a href="mailto:info@socialnow.nl">info@socialnow.nl</a> and we will plan a call with you.</p></noscript>
</body>
</html>
